<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mexemplar Real Grand Tour Safe Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 48px));
        background: #ffffff;
        border: 1px solid #d8dde6;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 20px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
      }

      input {
        height: 38px;
        border: 1px solid #b8c2cc;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
      }

      button {
        margin-top: 14px;
        height: 38px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #155eef;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }

      #status {
        margin: 18px 0 0;
        color: #52606d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mexemplar-real-tour-local-fixture-form-v1</h1>
      <label>
        Request
        <input aria-label="Request" autocomplete="off" />
      </label>
      <button type="button" id="submit">Submit</button>
      <p id="status">Ready</p>
    </main>
    <script>
      document.querySelector("#submit").addEventListener("click", () => {
        document.body.dataset.done = "1";
        document.querySelector("#status").textContent = "Submitted";
      });
    </script>
  </body>
</html>
