<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
    }
    .status {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    }
    .status.recording {
      background: #ffebee;
      color: #c62828;
    }
    .status.idle {
      background: #e8f5e9;
      color: #2e7d32;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-start {
      background: #4caf50;
      color: white;
    }
    .btn-stop {
      background: #f44336;
      color: white;
    }
    .btn-export {
      background: #2196f3;
      color: white;
    }
    #info {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .action-count {
      font-weight: bold;
      color: #2196f3;
    }
  </style>
</head>
<body>
  <div id="app-status" style="
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    background: #fff3e0;
    color: #e65100;
    display: none;
  ">未连接 Mexemplar App</div>
  <div id="status" class="status idle">未录制</div>
  <button id="btnStart" class="btn-start">开始录制</button>
  <button id="btnStop" class="btn-stop" disabled>停止录制</button>
  <button id="btnExport" class="btn-export" disabled>导出JSON</button>
  <div id="info"></div>
  
  <script src="popup.js"></script>
</body>
</html>
