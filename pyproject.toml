[project]
name = "mexemplar"
version = "0.1.0"
description = "桌面端智能办公助理 - 基于示例驱动的个人助理"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "gaopan", email = "gaopannice@163.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.75.0",
    "blinker>=1.9.0",
    "comtypes>=1.4.12; platform_system == 'Windows'",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "mitmproxy>=11.0.0",
    "mss>=10.1.0",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.0",
    "playwright>=1.57.0",
    "psutil>=5.9.0",
    "pydantic>=2.10.0",
    "pynput>=1.8.1",
    "pywin32>=311; platform_system == 'Windows'",
    "pywinauto>=0.6.9",
    "sqlglot>=23.0.0,<30.0.0",
    "tldextract>=5.0.0,<6.0.0",
    "uiautomation>=2.0.29; platform_system == 'Windows'",
    "uvicorn>=0.34.0",
    "websockets>=14.0.0",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.3",
    "sqlite-vec>=0.1.6",
    "markdownify>=1.2.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "black>=25.12.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: headful GUI end-to-end tests that require explicit opt-in",
    "real_llm: run the test against a real LLM instead of the scripted mock client",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-p", "no:qt",
]
